name: Deploy SIA SKILL OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          rm -rf build-source
          mkdir -p build-source
          unzip -q SIA_SKILL_OS.zip -d build-source

      - name: Locate project
        shell: bash
        run: |
          PROJECT_DIR="$(dirname "$(find build-source -name package.json -type f -print -quit)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json was not found inside SIA_SKILL_OS.zip"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Source and domain checks
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run check:syntax
          npm run audit:source
          node scripts/run-smoke.mjs

      - name: Production build
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Prepare Pages artifact
        shell: bash
        run: |
          rm -rf site
          mkdir -p site
          cp -R "$PROJECT_DIR/dist/." site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
