name: Deploy SIA SKILL OS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf build-source
          mkdir build-source
          unzip -q SIA_SKILL_OS.zip -d build-source

      - name: Find project
        run: |
          PROJECT_DIR=$(dirname "$(find build-source -name package.json -type f -print -quit)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json was not found inside the ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Build
        run: |
          cd "$PROJECT_DIR"
          npm run build

      - name: Prepare Pages artifact
        run: |
          rm -rf site
          mkdir site
          cp -R "$PROJECT_DIR/dist/." site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
